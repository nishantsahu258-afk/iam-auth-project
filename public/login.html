<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureID - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
</head>
<body class="login-page">
    <main class="container">
        <div class="login-wrapper">
            
            <!-- Left Sidebar for Desktop -->
            <div class="login-sidebar">
                <div class="sidebar-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#FFFFFF"/>
                        <!-- Adding a small lock inside for login specific logo if desired, or keeping it plain. Mockup shows a lock inside the shield. -->
                        <path d="M12 15c-1.1 0-2-.9-2-2v-1c0-1.1.9-2 2-2s2 .9 2 2v1c0 1.1-.9 2-2 2zM10.5 12h3" stroke="#1A56DB" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <h2>SecureID</h2>
                    <p>Secure access<br>to your account</p>
                </div>
                <div class="sidebar-footer">
                    &copy; 2026 SecureID. All rights reserved.
                </div>
            </div>

            <!-- Right Content Area -->
            <div class="login-content">
                <!-- Mobile Logo (Hidden on Desktop) -->
                <div class="mobile-logo text-center">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="mx-auto">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#1A56DB"/>
                        <!-- White lock inside blue shield -->
                        <path d="M10 12v-1c0-1.1.9-2 2-2s2 .9 2 2v1m-3 0h2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                        <rect x="9" y="12" width="6" height="4" rx="1" fill="#FFFFFF"/>
                    </svg>
                </div>

                <div class="form-header text-center">
                    <h1>Welcome back!</h1>
                    <p>Login to your account</p>
                </div>

                <div id="loginError" class="form-error" style="display: none;"></div>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="form-layout" style="grid-template-areas: 'email' 'password' 'options' 'button' 'divider' 'google' 'links';">
                        
                        <div class="input-group" style="grid-area: email;" id="group-email">
                            <label for="email" class="sr-only" style="display: none;">Email or Username</label>
                            <div class="input-with-icon">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </span>
                                <input type="text" id="email" class="input-control has-icon" placeholder="Email or Username">
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <div class="input-group" style="grid-area: password;" id="group-password">
                            <label for="password" class="sr-only" style="display: none;">Password</label>
                            <div class="password-input-wrapper">
                                <div class="input-with-icon">
                                    <span class="input-icon">
                                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                    </span>
                                    <input type="password" id="password" class="input-control has-icon" placeholder="Password">
                                </div>
                                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <div class="login-options" style="grid-area: options;">
                            <div class="terms-group-wrapper" style="margin: 0;">
                                <div class="terms-group">
                                    <input type="checkbox" id="rememberMe">
                                    <label for="rememberMe" style="font-weight: 500;">Remember me</label>
                                </div>
                            </div>
                            <a href="#" class="forgot-password">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-primary" style="grid-area: button;">Login</button>

                        <div class="divider" style="grid-area: divider;">
                            <span>or</span>
                        </div>

                        <button type="button" class="btn-outline btn-google" style="grid-area: google;">
                            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            Continue with Google
                        </button>

                        <div class="auth-links text-center" style="grid-area: links; margin-top: 1rem;">
                            New here? <a href="index.html">Create an account</a>
                        </div>
                    </div>
                </form>

                <div class="footer-copyright mobile-only-footer">&copy; 2026 SecureID. All rights reserved.</div>
            </div>
        </div>
    </main>
</body>
</html>
